<style>
body{margin:0;background:#0b1020;color:#e8ecf4;font-family:'Assistant',system-ui,Segoe UI,Roboto,Helvetica,Arial}
.progress{margin-top:10px;height:8px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.progress__bar{height:100%;width:0%;background:linear-gradient(90deg,#60a5fa,#a78bfa);transition:width .08s linear}
.sub{margin:0 0 12px;color:#9aa3b2;font-size:14px}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.phone{
  width:min(420px, 92vw);
  height:calc(min(420px, 92vw) * 1.78); /* יחס נעים ~16:9 */
  border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  background:#0f152a;
  display:flex;               /* חשוב: מאפשר לילד למלא גובה */
  flex-direction:column;      /* כותרת סטטוס למעלה, תוכן מתחת */
}
@media (max-width: 480px){
  .stage{ min-height:100svh; align-items:stretch; justify-content:stretch; }
  .phone{ width:100vw; height:100svh; border-radius:0; border:0; box-shadow:none; }
  .wrap{ padding:clamp(16px,4vw,24px); }
}
  
/* status bar (preview-only) */
.status{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;
font-size:12px;color:#aeb7c8;background:linear-gradient(0deg,rgba(255,255,255,.06),rgba(255,255,255,.09))}
.status .dots{display:flex;gap:4px}
.status .dot{width:6px;height:6px;border-radius:50%;background:#aeb7c8;opacity:.85}
.wrap{
  padding:16px;
  flex:1;                           /* ימלא את כל גובה ה"טלפון" */
  overflow:auto;                     /* כאן הגלילה מתבצעת */
  -webkit-overflow-scrolling: touch; /* אינרציה חלקה באייפון */
  overscroll-behavior: contain;      /* לא מושך את העמוד שמסביב */
}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px}
.h1{font-size:22px;font-weight:800;margin:0 0 6px}
.p{margin:0 0 10px;color:#9aa3b2}
.btn{appearance:none;border:0;border-radius:0px;padding:12px 14px;font-weight:700;cursor:pointer}
.btn-primary{background:linear-gradient(90deg,#34d399,#10b981);color:#062d24}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#1d243d;border:1px solid rgba(255,255,255,.08);font-size:12px;color:#9aa3b2;margin-bottom:10px}
/* Infinite: inline percent inside the button + canvas confetti */
.btn{position:relative}
.btn .label{pointer-events:none}
.btn .percent{position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:12px; opacity:.9}

/* earned is hidden by default */
.earned{display:none}

/* gentle shake */
@keyframes infShake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.shake{animation:infShake .35s linear 1}

/* confetti canvas */
.confetti-canvas{position:fixed; inset:0; pointer-events:none; z-index:999}
.confetti-canvas{ width:100vw; height:100vh }
  /* Kefpo brand badge (runtime-only) */
.kf-badge{
  position: sticky;         /* נדבק לראש אזור הגלילה של .wrap */
  top: 8px;
  align-self: center;
  display: inline-flex; gap: 8px; align-items: center;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.10);
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
  color: #9aa3b2; font-size: 12px; font-weight: 800;
  text-decoration: none;
  z-index: 5;
}
.kf-badge:hover{ border-color: rgba(255,255,255,.18); transform: translateY(-1px); }
.kf-badge i{ width: 8px; height: 8px; border-radius: 50%;
  background: linear-gradient(90deg,#60a5fa,#a78bfa);
  box-shadow: 0 0 10px rgba(167,139,250,.6);
}
  /* Custom scrollbar for touch devices (mobile only) */
@media (hover:none) and (pointer:coarse){
  .custom-scrollbar{
    position:absolute; top:10px; bottom:10px; right:6px;
    width:3px; border-radius:999px;
    background:rgba(255,255,255,.08);   /* מסילה דקה וסטטית */
    pointer-events:none;                 /* לא חוסם נגיעות בתוכן */

  .custom-scrollbar .thumb{
    position:absolute; left:0; top:0; width:100%;

.react-overlay { position: fixed; inset: 0; background: rgba(11, 16, 32, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: fadeIn 0.3s ease-out; }

/* The "Card" for the hook screen */
.react-card {
  background: #151b2e; /* Dark blue matching app */
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 32px 24px;
  width: 90%;
  max-width: 340px;

.react-btn-record { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #fff; background: #ef4444; cursor: pointer; transition: transform 0.2s; position: relative; margin-bottom: 10px; }
.react-btn-record.recording { animation: pulseRec 1.5s infinite; background: transparent; border-color: #ef4444; }
.react-btn-record.recording::after { content:''; position:absolute; inset:16px; background:#ef4444; border-radius:8px; }
@keyframes pulseRec { 0%{box-shadow: 0 0 0 0 rgba(239,68,68, 0.4);} 70%{box-shadow: 0 0 0 24px rgba(239,68,68, 0);} 100%{box-shadow: 0 0 0 0 rgba(239,68,68, 0);} }

.react-timer { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); background: rgba(239,68,68,0.9); padding: 6px 16px; border-radius: 99px; font-weight: 800; font-size: 16px; color: #fff; display:none; z-index: 30; letter-spacing: 1px; }

.react-icon-bounce { font-size: 42px; margin-bottom: 8px; display: inline-block; animation: bounce 2s infinite; }
@keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }

.react-title { font-size: 24px; font-weight: 800; margin: 0; color: #fff; line-height: 1.2; }
.react-sub { font-size: 16px; color: #9aa3b2; margin: 0; line-height: 1.5; }

.react-btn-main { width: 100%; background: linear-gradient(90deg, #10b981, #059669); color: #fff; font-weight: 700; padding: 18px; border-radius: 16px; border: none; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); transition: transform 0.1s; }

<script>
(function(){
const qs = new URLSearchParams(location.search);
// --- Start of URL Fixer ---
  function normalizeUrl(url, fallback) {
    var c = (url || '').trim();
    if (!c && fallback) c = fallback; 
    if (!c || c === '#') return '#';
    if (!/^https?:\/\//i.test(c)) return 'https://' + c;
    return c;
  }
  // --- End of URL Fixer ---
const F = (qs.get('f')||'').trim(); // feature slug
const NAME = (qs.get('name')||'Friend').trim();
const GIFT = normalizeUrl(qs.get('giftUrl'));
const PREV = (qs.get('preview')||'0').trim()==='1';
/* --- REACTION CAM LOGIC --- */
const REACTION_ON = (qs.get('reaction') || '0') === '1';
const SENDER = (qs.get('sender') || '').trim(); // שם השולח (או ריק)

// פונקציה ראשית שנקראת בסוף כל מתיחה
function tryReactionFlow(fallbackUrl) {
  // 1. בדיקת תנאי סף
  if (!REACTION_ON || PREV) {
    if(fallbackUrl) window.location.href = fallbackUrl;
    return;
  }

  const senderText = SENDER ? SENDER : "The sender";
  
  // 3. הזרקת ה-HTML (מבנה משופר: פופאפ בהתחלה, מסך מלא בהקלטה)
  const div = document.createElement('div');
  div.className = 'react-overlay';
  div.innerHTML = `
    <div id="videoContainer" class="react-video-container hidden">
      <video id="rvVideo" class="react-video" autoplay playsinline muted></video>
      <div id="rvTimer" class="react-timer">00:00</div>
    </div>
    
    <div id="stepHook" class="react-card">
      <div class="react-icon-bounce">📸</div>
      <div>
        <h2 class="react-title">${senderText} is dying to see your face...</h2>
        <p class="react-sub" style="margin-top:8px">
Send ${senderText} a 5 seconds reaction video, before you grab the gift.
        </p>
      </div>
      <button id="btnStartCam" class="react-btn-main">
        <span>Record Quick Reaction</span>
      </button>
      <button id="btnSkip1" class="react-btn-sec">Skip to gift (and break their heart)</button>
    </div>

    <div id="stepRec" class="react-controls-overlay hidden">
      <div class="react-title" style="text-shadow:0 2px 4px rgba(0,0,0,0.5)">Recording...</div>
      <button id="btnRecordToggle" class="react-btn-record"></button>
      <p class="react-sub" style="color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.8)">Tap to stop (Max 10s)</p>
    </div>

    <div id="stepShare" class="react-controls-overlay hidden">
      <h2 class="react-title">That was epic! 😂</h2>
      <p class="react-sub" style="color:#e2e8f0">Share it to unlock your gift immediately.</p>
      <button id="btnShare" class="react-btn-main react-btn-share">📤 Share on WhatsApp & Unlock</button>
      <div style="display:flex; gap:12px; width:100%">
        <button id="btnRetake" class="react-btn-sec" style="flex:1; color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:12px">↻ Retake</button>
        <button id="btnSkip2" class="react-btn-sec" style="flex:1; color:#cbd5e1">Skip</button>
      </div>
    </div>
  `;
  document.body.appendChild(div);

  // --- לוגיקה (אותה לוגיקה בדיוק, רק התאמה ל-Classes החדשים) ---
  const video = document.getElementById('rvVideo');
  const timer = document.getElementById('rvTimer');
  const vidContainer = document.getElementById('videoContainer');
  let mediaRecorder;
  let recordedChunks = [];
  let stream;
  let startTime;
  let timerInt;

  const goGift = () => { window.location.href = fallbackUrl; };
  document.getElementById('btnSkip1').onclick = goGift;
  document.getElementById('btnSkip2').onclick = goGift;

  // התחלת המצלמה
  document.getElementById('btnStartCam').onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
      video.srcObject = stream;
      
      // החלפת מצבים: מעלים את הפופאפ, מציגים וידאו
      document.getElementById('stepHook').classList.add('hidden');
      vidContainer.classList.remove('hidden'); // מציג את הוידאו
      document.getElementById('stepRec').classList.remove('hidden');
      
      // התחלה אוטומטית אחרי חצי שנייה
      setTimeout(startRecording, 500);
    } catch (e) {
      alert("Camera access denied or error. Skipping to gift.");
      goGift();
    }
  };

  const startRecording = () => {
    recordedChunks = [];
    try {
      mediaRecorder = new MediaRecorder(stream);
    } catch (e) {
      // Fallback לדפדפנים ישנים
      mediaRecorder = new MediaRecorder(stream);
    }
    
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    
    mediaRecorder.onstop = () => {
      // FIX: Stop camera logic moved here for iOS 14+ support
      if (stream) stream.getTracks().forEach(t => t.stop());
      
      clearInterval(timerInt);
      timer.style.display = 'none';
      
      const blob = new Blob(recordedChunks, { type: "video/mp4" });
      const videoURL = URL.createObjectURL(blob);
      video.srcObject = null;
      video.src = videoURL;
      video.loop = true;
      video.play(); // ניגון לופ
      
      document.getElementById('stepRec').classList.add('hidden');
      document.getElementById('stepShare').classList.remove('hidden');
      document.getElementById('btnRecordToggle').classList.remove('recording');

      // שיתוף
      document.getElementById('btnShare').onclick = async () => {
        const file = new File([blob], "reaction.mp4", { type: "video/mp4" });
        const btn = document.getElementById('btnShare');
        
        btn.textContent = "🔓 Unlocking Gift...";
        btn.style.opacity = "0.8"; // פידבק ויזואלי

        // פונקציית העברה משוריינת
        const forceRedirect = () => {
            // בדיקת בטיחות: האם יש בכלל לינק למתנה?
            if (!fallbackUrl || fallbackUrl.length < 5) {
                alert("Error: No gift URL found in the link parameters!");
                return; 
            }
            // שימוש ב-replace כדי למנוע חזרה אחורה ולחייב מעבר
            window.location.replace(fallbackUrl);
        };

        if (navigator.share) {
          try {
            await navigator.share({
              files: [file],
              title: 'My Reaction!',
              text: 'Check out my reaction 😂'
            });
            // הצלחה - המתן חצי שנייה ועבור
            setTimeout(forceRedirect, 500); 
          } catch (err) {
             // המשתמש ביטל או שגיאה - עדיין נעביר אותו למתנה
             setTimeout(forceRedirect, 500); 
          }
        } else {
          // דסקטופ או דפדפן ישן
          alert("Video saved! Unlocking gift...");
          forceRedirect();
        }
      };
    };

    mediaRecorder.start();
    document.getElementById('btnRecordToggle').classList.add('recording');
    timer.style.display = 'block';
    startTime = Date.now();
    
    timerInt = setInterval(() => {
      const sec = Math.floor((Date.now() - startTime) / 1000);
      timer.textContent = "00:0" + sec;
      if (sec >= 10) stopRecording();
    }, 1000);
    
    document.getElementById('btnRecordToggle').onclick = stopRecording;
  };

  const stopRecording = () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    // Stream stop logic moved to onstop event
  };
  
  document.getElementById('btnRetake').onclick = () => {
    // איפוס מלא
    document.querySelector('.react-overlay').remove();
    tryReactionFlow(fallbackUrl);
  };
}
  
function getCopy(key, fallback) {
  const v = qs.get(key);
  if (!v || v.trim().length === 0) return fallback;
  return v.trim().slice(0, 80);
}
// === High‑quality SFX (from your GitHub) with safe fallback ===
const SFX_BASE = 'https://tubile.github.io/kefpo-sfx/';
const SFX_FILES = {
  click:   'click.mp3',
  confirm: 'confirm.mp3',
  error:   'error.mp3',
  tada:    'tada.mp3',
  whoosh:  'whoosh.mp3'
};

// Preload one Audio element per sound (ניצור שיבוט בכל השמעה כדי לאפשר חפיפה)
const __SFX = {};
for (const [k,f] of Object.entries(SFX_FILES)) {
  const a = new Audio(SFX_BASE + f);
  a.preload = 'auto';
  a.crossOrigin = 'anonymous'; // בטוח גם אם תרצה WebAudio בעתיד
  __SFX[k] = a;
}

// ניסיון “פריימינג” עדין לפתיחת אודיו במובייל בהקשה הראשונה
document.addEventListener('pointerdown', ()=>{
  try{
    const a = __SFX.click;
    a.muted = true;
    const p = a.play();
    if (p && p.then) p.then(()=>{ a.pause(); a.currentTime = 0; a.muted = false; });
  }catch(_){}
}, { once:true });

function sfx(kind){
  const key = (kind in __SFX) ? kind : 'click';
  try{
    // מנגן שיבוט כדי לאפשר כמה צלילים זה על זה
    const a = __SFX[key].cloneNode(true);
    a.play().catch(()=>{ /* ייתכן בלוק אוטופליי – נתעלם בשקט */ });
  }catch(e){
    // Fallback – ביפ סינתטי (כמו שהיה)
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      const now = ctx.currentTime, freq = { error:180, whoosh:420, tada:880, confirm:520, click:660 }[kind] || 600;
      o.type='sine'; o.frequency.setValueAtTime(freq, now);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.2, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(now + 0.16);
    }catch(_) {}
  }
}

// הצג סטטוס־בר רק בפריביו
if (PREV) document.getElementById('status').style.display = 'flex';

  // ----- Custom mobile scrollbar logic -----
const WRAP = document.querySelector('.wrap');
const SB   = document.getElementById('mScroll');
const TH   = SB ? SB.querySelector('.thumb') : null;

function updateScrollbar(){
  if(!WRAP || !SB || !TH) return;
  const sh = WRAP.scrollHeight, ch = WRAP.clientHeight, st = WRAP.scrollTop;
  // אם אין עודף גובה – לא להציג את הפס
  if (sh <= ch + 1){ SB.style.display = 'none'; return; }
  SB.style.display = ''; // יש גלילה → להציג

  // חישוב גובה האגודל ומיקומו
  const track = SB.clientHeight;
  const minThumb = 28;
  const thumbH = Math.max(minThumb, Math.round(track * (ch / sh)));
  const y = Math.round((track - thumbH) * (st / (sh - ch)));
  TH.style.height = thumbH + 'px';
  TH.style.transform = `translateY(${y}px)`;
}

let hideTimer;
if (WRAP){
  WRAP.addEventListener('scroll', ()=>{
    WRAP.classList.add('scrolling');
    updateScrollbar();
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=> WRAP.classList.remove('scrolling'), 400);
  }, {passive:true});

  // כשמתחלף מסך בפיצ'ר (אנחנו משנים innerHTML על #app) – לחשב מחדש
  const obs = new MutationObserver(()=> requestAnimationFrame(updateScrollbar));
  obs.observe(document.getElementById('app'), { childList:true, subtree:true });

  window.addEventListener('resize', updateScrollbar);
  // חישוב ראשון
  requestAnimationFrame(updateScrollbar);
}

    "https://images.pexels.com/photos/1072179/pexels-photo-1072179.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&dpr=2",
    "https://images.pexels.com/photos/113338/pexels-photo-113338.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&dpr=2",

  function placeholderDataURL(){
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><rect width='100%' height='100%' fill='white'/><g fill='#111' font-family='sans-serif' font-weight='700'><text x='50%' y='35%' text-anchor='middle' font-size='72'>We'll put</text><text x='50%' y='50%' text-anchor='middle' font-size='72'>their photo</text><text x='50%' y='65%' text-anchor='middle' font-size='72'>here 🤣</text></g></svg>`;
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }
  const PLACEHOLDER = placeholderDataURL();

  function sizeForGrid(src){
    try{
      const u = new URL(src);
      if (/res\.cloudinary\.com/.test(u.hostname)) return src.replace('/upload/', '/upload/f_auto,q_auto,w_600,h_600,c_fill/');
      if (/images\.pexels\.com/.test(u.hostname)) {

  function getTargetSrc(slotIndex){
    if (IMG_URLS[slotIndex]) return IMG_URLS[slotIndex];
    if (PREV || !anyProvided) return PLACEHOLDER;
    const present = IMG_URLS.filter(Boolean);

    // --- לוגיקה פנימית לניהול "תתי-לחיצות" ---
    // אם אנחנו בשלבים המתקדמים (4-7), צריך לצבור לחיצות כדי להתקדם בטקסט
    if (stage >= 4 && stage < 8) {
      subTaps++;
      // אם עדיין לא הגענו למכסה הרנדומלית, רק תברח ותישאר באותו שלב טקסט
      if (subTaps < requiredTaps) {
        // בריחה כבר קורית ב-touchstart/mouseover, אבל כאן נוודא תזוזה נוספת ליתר ביטחון
        const x = (Math.random() * 140) - 70; 
        const y = (Math.random() * 100) - 50;
        btn.style.transform = `translate(${x}px, ${y}px)`;
        return; // יוצאים מהפונקציה ולא מקדמים את ה-stage
      }
      // אם הגענו למכסה -> מאפסים ומתקדמים
      subTaps = 0;
      requiredTaps = randomizeTaps(); 
    }

    // --- קידום שלב ראשי ---
    if (stage === 0) { // התחלה -> טעינה
      stage = 1;
      loading = true;
      ilabel.textContent = copy.btn1_loading;
      progWrap.style.display = 'block';
      ipct.style.display = 'inline';
      sfx('confirm');

      let p = 0;
      const int = setInterval(()=>{
        p += Math.floor(Math.random()*12)+5;
        if(p>100) p=100;
        bar.style.width = p + '%';
        ipct.textContent = p + '%';
        if(p === 100){
          clearInterval(int);
          setTimeout(()=>{ loading = false; btn.click(); }, 350);
        }
      }, 120);
      return;
    }

    // אם אנחנו בשלב 1 (אחרי טעינה), מתקדמים ל-2
    if (stage === 1) { stage = 2; }
    else if (stage >= 2) { stage++; } // קידום רגיל

    // --- טיפול ויזואלי לפי השלב החדש ---

    // שלב 2: שגיאה
    if (stage === 2){
      ilabel.textContent = copy.btn2_error;
      btn.className = 'btn error-red';
      ipct.style.display = 'none';
      progWrap.style.display = 'none';
      
      const oldBg = document.body.style.background;
      document.body.style.transition = 'background 0.1s';
      document.body.style.background = '#450a0a';
      inner.classList.add('shake');
      sfx('error');
      
      setTimeout(()=>{ 
        document.body.style.background = oldBg; 
        inner.classList.remove('shake');
      }, 300);
      return;
    }

    // שלב 3: הקפצה ראשונה
    if (stage === 3){
      resetBtn();
      ilabel.textContent = copy.btn3_tease1;
      btn.style.transform = `translate(40px, -20px)`;
      sfx('whoosh');
      return;
    }

    // שלב 4: התחלת בריחה (מפעילים את המנגנון)
    if (stage === 4){
      ilabel.textContent = copy.btn4_tease2;
      makeDodge(); 
      requiredTaps = randomizeTaps(); // מגדירים לראשונה כמה לחיצות צריך כדי להגיע ל-5
      return;
    }

    // שלבים 5, 6, 7 - רק מחליפים טקסט (הבריחה כבר פעילה)
    if (stage === 5){ ilabel.textContent = copy.btn5_tease3; return; }
    if (stage === 6){ ilabel.textContent = copy.btn6_tease4; return; }
    if (stage === 7){ ilabel.textContent = copy.btn7_tease5; return; }

    // שלב 8: הצלחה
    if (stage >= 8){
      showKfBadge();
      success = true;
      const newBtn = btn.cloneNode(true);
      btn.parentNode.replaceChild(newBtn, btn);
      newBtn.style.transform = 'translate(0,0)';
      
      inner.innerHTML = `
        <div class="inf-success-icon" aria-hidden="true" style="margin:0 auto 16px">💝</div>
        <h1 style="font-size:24px; margin-bottom:8px">${copy.earned}</h1>
        <button id="ibtn-final" class="btn green"${PREV?' disabled':''}>${copy.btn8_success}</button>
        ${ PREV ? `<div class="sub" style="margin-top:10px; font-size:12px">Preview only – button disabled</div>` : `` }
        <canvas id="confetti-final" class="confetti-canvas"></canvas>
      `;
      
      canvas = inner.querySelector('#confetti-final');
      boom();
      sfx('tada');
      document.getElementById('ibtn-final').addEventListener('click', function(){
        // Fix: Block click in preview mode
        if(PREV) return;
        tryReactionFlow(GIFT);
      });
    }
  });
}

  const app = document.getElementById('app');
  app.classList.remove('card');

  function sfx(k){ try{ window.sfx(k); }catch(_){} }

  // Confetti
  function confettiBurst(canvas){
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const r = window.devicePixelRatio || 1;
    function size(){ canvas.width = canvas.clientWidth * r; canvas.height = canvas.clientHeight * r; ctx.setTransform(r,0,0,r,0,0); }
    canvas.style.display='block'; size();
    const colors = ['#a78bfa','#60a5fa','#34d399','#f472b6','#f59e0b'];
    const pieces = [];
    for(let i=0;i<120;i++){ pieces.push({x:canvas.width/2/r, y:canvas.height/2/r, vx:(Math.random()*4-2), vy:(Math.random()*-3-2), r:Math.random()*6+3, c:colors[Math.floor(Math.random()*colors.length)], a:1}); }
    (function step(){
      ctx.clearRect(0,0,canvas.width/r,canvas.height/r);
      pieces.forEach(p=>{ p.vy+=0.05; p.x+=p.vx; p.y+=p.vy; p.a-=0.008; ctx.globalAlpha=Math.max(p.a,0); ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.r,p.r); });
      ctx.globalAlpha=1;
      if(pieces.some(p=>p.a>0)) requestAnimationFrame(step); else canvas.style.display='none';
    })();
  }

  // Motion Sensor logic
  let motionOn = false, last = {x:0,y:0,z:0}, handler = null;
  function startMotion(onLevel){
    try{
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
        DeviceMotionEvent.requestPermission().then(st=>{ if(st==='granted') attach(); }).catch(()=>{});
      } else { attach(); }
    }catch(_){}

    function attach(){
      if (handler) return;
      handler = (e)=>{
        const acc = e.accelerationIncludingGravity || e.acceleration || {x:0,y:0,z:0};
        const dx = (acc.x||0) - last.x, dy=(acc.y||0)-last.y, dz=(acc.z||0)-last.z;
        last = {x:acc.x||0, y:acc.y||0, z:acc.z||0};
        let mag = Math.sqrt(dx*dx + dy*dy + dz*dz) * 5; 
        mag = Math.max(0, Math.min(100, Math.floor(mag)));
        onLevel && onLevel(mag);
      };
      addEventListener('devicemotion', handler, { passive:true });
      motionOn = true;
    }
  }
  function stopMotion(){
    try{ removeEventListener('devicemotion', handler, { passive:true }); }catch(_){}
    handler = null; motionOn = false;
  }

  let attempt = 0; 
  let trollInterval = null;

  function screenIntro(){

  function runAttempt(){

    stopMotion();

    // לוגיקה חדשה: ספירה לאחור רק בפעם הראשונה
    const showCountdown = (attempt <= 2);
    
    // כותרת משתנה: בהתחלה ספירה, אחר כך הוראה
    let titleText = copy.countTitle;
    if (!showCountdown) titleText = "Shake harder! 📱";

    app.innerHTML = `

          </div>
          <div class="sh-meter"><i id="shBar"></i></div>
        </div>
        <canvas id="shConfetti" class="confetti-canvas"></canvas>
      </div>

      <div id="shErr1" class="sh-toast"><div class="box"><h3>${copy.err1Title}</h3><p>${copy.err1Text}</p><div style="height:10px"></div><button class="btn sh-cta green" data-ok>Try again</button></div></div>
      <div id="shErr2" class="sh-toast"><div class="box"><h3>${copy.err2Title}</h3><p>${copy.err2Text}</p><div style="height:10px"></div><button class="btn sh-cta green" data-ok>Try again</button></div></div>
      <div id="shErr3" class="sh-toast"><div class="box"><h3>${copy.err3Title}</h3><p>${copy.err3Text}</p><div style="height:10px"></div><button class="btn sh-cta green" data-ok>Try again, hero!</button></div></div>
    `;

    const cnt = document.getElementById('shCount');
    const zone = document.getElementById('shZone');
    const bar  = document.getElementById('shBar');

    // פונקציית סיום הניעור (כישלון או הצלחה)
    const finishShake = () => {
      stopMotion();
      clearInterval(trollInterval);

      if (attempt <= 3){
        // כישלון
        document.querySelector('.wrap-shake')?.classList.add('shake');
        setTimeout(()=>document.querySelector('.wrap-shake')?.classList.remove('shake'), 380);
        
        sfx('error');
        const toast = document.getElementById('shErr'+attempt);
        if(toast) toast.classList.add('show');
        
        // לחיצה על כפתור השגיאה מחזירה מיד לניסיון הבא
        document.querySelectorAll('#shErr'+attempt+' [data-ok]').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            toast.classList.remove('show');
            runAttempt(); // ריצה חוזרת מיידית
          }, { once:true });
        });
      } else {
        // הצלחה
        screenSuccess();
      }
    };

    // --- לוגיקת ה-Troll Bar (ניסיון 3) ---
    const simulateTrollBar = () => {
      let p = 0;
      let phase = 'up'; // up, stall, drop
      
      trollInterval = setInterval(() => {
        if (phase === 'up') {
          p += 4; // עולה מהר
          if (p >= 98) { 
            p = 98; 
            phase = 'stall'; 
            // אחרי שנייה של תקיעה -> נופל
            setTimeout(() => { phase = 'drop'; }, 800);
          }
        } else if (phase === 'stall') {
          // רועד קצת ב-98%
          p = 98 + (Math.random() * 2 - 1);
        } else if (phase === 'drop') {
          p -= 10; // נופל בבום
          if (p <= 0) {
            p = 0;
            clearInterval(trollInterval);
            finishShake(); // מפעיל את השגיאה
          }
        }
        if (bar) bar.style.width = p + '%';
      }, 30);
    };

    // --- ניהול הזרימה ---
    if (showCountdown){
      // פעם ראשונה: ספירה 3..2..1 ואז מתחיל
      let n = 3; // קיצרנו מ-5 ל-3
      cnt.textContent = String(n);
      const t = setInterval(()=>{
        n -= 1;
        if(n<=0){
          clearInterval(t);
          cnt.style.display='none';
          zone.style.display='grid';
          startMotion(level => { if(bar) bar.style.width = level + '%'; });
          setTimeout(finishShake, 4000); // זמן ניעור רגיל
        } else {
          cnt.textContent = String(n);
        }
      }, 1000);
    } else {
      // פעמים הבאות: מיידי
      if (attempt === 3) {
        // ניסיון 3: הפעלת ה-Troll Bar המזויף
        simulateTrollBar();
      } else {
        // ניסיון 2 ו-4: ניעור רגיל (או הצלחה)
        startMotion(level => { if(bar) bar.style.width = level + '%'; });
        // בניסיון 4 ניתן להם פחות זמן המתנה (2 שניות) להצלחה מהירה
        const waitTime = (attempt >= 4) ? 2000 : 4000;
        setTimeout(finishShake, waitTime);
      }
    }
  }

  function screenSuccess(){
    showKfBadge();
    app.innerHTML = `

      if(PREV) return;
      sfx('confirm');
      tryReactionFlow(GIFT);
    });
  }

  screenIntro();
}

    document.head.appendChild(css);
  }

  // שימוש ב-SFX מהסקלטון
  function play(kind){ try{ sfx(kind); }catch(e){} }

  // קונפטי (אותו מנוע כמו בשאר הפיצ'רים)
  function confettiBurst(canvas){
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const r = window.devicePixelRatio || 1;
    function size(){ canvas.width = canvas.clientWidth * r; canvas.height = canvas.clientHeight * r; ctx.setTransform(r,0,0,r,0,0); }
    if(!canvas.__sized){ canvas.__sized = true; size(); addEventListener('resize', size); }
    canvas.style.display='block'; size();
    const colors = ['#a78bfa','#60a5fa','#34d399','#f472b6','#f59e0b'];
    const pieces = [];
    for(let i=0;i<120;i++){ pieces.push({x:canvas.width/2/r, y:canvas.height/2/r, vx:(Math.random()*4-2), vy:(Math.random()*-3-2), r:Math.random()*6+3, c:colors[Math.floor(Math.random()*colors.length)], a:1}); }
    (function step(){
      ctx.clearRect(0,0,canvas.width/r,canvas.height/r);
      pieces.forEach(p=>{ p.vy+=0.05; p.x+=p.vx; p.y+=p.vy; p.a-=0.008; ctx.globalAlpha=Math.max(p.a,0); ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.r,p.r); });
      ctx.globalAlpha=1;
      if(pieces.some(p=>p.a>0)) requestAnimationFrame(step); else canvas.style.display='none';
    })();
  }

  // DOM יעד
  var app = document.getElementById('app');
  // --- TOOLTIP SYSTEM LOGIC (Updated: Resets on Reload) ---
  function showTooltip(type) {
    // 1. הגנה קריטית: מופיע רק ב-Preview Mode
    if (typeof PREV === 'undefined' || !PREV) return;

    // 2. הגנה מכפילויות: אם כבר יש טולטיפ פתוח על המסך - אל תפתח עוד אחד
    if (document.querySelector('.prev-tooltip')) return;

    // תוכן לפי סוג
    let title, text, icon;
    if (type === 'intro') {
      icon = '👤';
      title = 'Preview Mode';
      text = '"Friend" is a placeholder. In the Finalize step, you will replace it with their real name.<br><br>This is what <b>they</b> will see first!';
      // Pulse Effect on Title
      const t = document.querySelector('.title');
      if(t) t.classList.add('tooltip-pulse');
    } else if (type === 'captcha') {
      icon = '📸';
      title = 'Placeholder Images';
      text = 'These are just stock photos. In the Finalize step, you will upload <b>THEIR</b> photo.<br><br>Imagine their reaction... 😂';
    }

    // יצירת האלמנט
    const div = document.createElement('div');
    div.className = 'prev-tooltip';
    div.innerHTML = `
      <span class="tooltip-icon">${icon}</span>
      <span class="tooltip-title">${title}</span>
      <span class="tooltip-text">${text}</span>
      <button class="tooltip-btn">Got it!</button>
    `;
    document.body.appendChild(div);

    // כניסה חלקה (אנימציה)
    requestAnimationFrame(() => div.classList.add('show'));

    // לוגיקת סגירה (לחיצה על הכפתור)
    div.querySelector('button').onclick = function() {
      // הסרת הקלאס (אנימציית יציאה)
      div.classList.remove('show');
      
      // הסרת אפקט הפעימה מהכותרת
      const t = document.querySelector('.title');
      if(t) t.classList.remove('tooltip-pulse');
      
      // מחיקה פיזית מה-DOM אחרי חצי שנייה
      setTimeout(() => div.remove(), 500);
    };
  }
  app.classList.remove('card');

  // --- מסכים ---
  function screenIntro(){
    app.innerHTML =
      '<div class="wrap wrap-breath' + (activeTheme !== 'dark' ? ' theme-' + activeTheme : '') + '">'+
        '<div class="bv-gift-icon" aria-hidden="true">🎁</div>'+
'<h1 class="bv-title">'+copy.introTitle+'</h1>'+
'<p class="bv-sub">'+copy.introSub+'</p>'+
'<button id="bv-start" class="btn bv brand">'+copy.introBtn+'</button>'+
        '<div class="bv-sub" style="font-size:12px">no data collected</div>'+
      '</div>';
    document.getElementById('bv-start').addEventListener('click', function(){ play('confirm'); screenCount(1); });
  }

  function screenCount(attempt){
    app.innerHTML =
      '<div class="wrap wrap-breath' + (activeTheme !== 'dark' ? ' theme-' + activeTheme : '') + '">'+
        '<h1 class="bv-title">'+copy.countTitle+'</h1>'+
        '<div class="bv-sub">'+copy.countSub+'</div>'+      
        '<div id="bv-count" class="bv-title" style="font-size:64px;font-weight:900;line-height:1">3</div>'+
      '</div>';
    var n = 3, el = document.getElementById('bv-count');
    var t = setInterval(function(){
      n -= 1;
      if(n<=0){ clearInterval(t); screenBlow(attempt); }
      else { el.textContent = String(n); }
    }, 1000);
  }

  function screenBlow(attempt){
    app.innerHTML =
      '<div class="wrap wrap-breath' + (activeTheme !== 'dark' ? ' theme-' + activeTheme : '') + '">'+
        '<h1 id="bv-title" class="bv-title">'+copy.blowTitle+'</h1>'+

        /* --- HERO חדש: טבעת נשיפה + שבילי רוח + צ'יפ --- */
        '<div class="bv-hero" aria-hidden="true">'+
          '<div class="bv-glass">'+
            '<div class="bv-ring">'+
              '<svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'+
                '<defs>'+
                  '<linearGradient id="bv-grad" x1="0%" y1="0%" x2="100%" y2="0%">'+
                    '<stop offset="0%" stop-color="#60a5fa"></stop>'+
                    '<stop offset="100%" stop-color="#a78bfa"></stop>'+
                  '</linearGradient>'+
                '</defs>'+
                '<circle class="bg" cx="60" cy="60" r="54"></circle>'+
                '<circle class="fg" id="bv-circ" cx="60" cy="60" r="54"></circle>'+
              '</svg>'+
              '<div class="bv-emoji" id="bv-emoji">🌬️</div>'+
            '</div>'+
            '<div class="bv-gust" id="bv-gust"><span></span><span></span><span></span></div>'+
          '</div>'+
          '<div class="bv-chip">'+copy.blowChip+'</div>'+
        '</div>'+

        /* --- המד/זמן הישנים נשמרים (לא נוגעים בפונקציונליות) --- */
        '<div class="bv-zone">'+
          '<div class="bv-meter" aria-hidden="true"><i id="bv-bar"></i></div>'+
          '<div class="bv-sub" id="bv-time">00:00</div>'+
          '<div id="bv-err" class="bv-sub" style="min-height:18px;color:#fca5a5"></div>'+
        '</div>'+
        (PREV?'<div class="bv-sub">Preview mode</div>':'')+
        '<canvas id="bv-confetti" class="confetti-canvas"></canvas>'+
      '</div>'+
      '<div id="bv-toast-err" class="toast"><div class="box"><h3>'+copy.errTitle+'</h3><p>'+copy.errText+'</p><div style="height:10px"></div><button id="bv-try" class="btn bv green">'+copy.errBtn+'</button></div></div>'+
      '<div id="bv-toast-ok" class="toast"><div class="box"><h3>'+copy.okToastTitle+'</h3><p>'+copy.okToastText+'</p><div style="height:10px"></div><button id="bv-go" class="btn bv green">'+copy.okToastBtn+'</button></div></div>';

    // הזזת טוסטים ל-body כדי שלא יושפעו מ-transform
    (function moveToBody(id){ var x=document.getElementById(id); if(x && !x.__moved){ document.body.appendChild(x); x.__moved=true; } })('bv-toast-err');
    (function moveToBody(id){ var x=document.getElementById(id); if(x && !x.__moved){ document.body.appendChild(x); x.__moved=true; } })('bv-toast-ok');

    var bar   = document.getElementById('bv-bar');
    var timeEl= document.getElementById('bv-time');
    var circ  = document.getElementById('bv-circ');
    var gust  = document.getElementById('bv-gust');
    var emoji = document.getElementById('bv-emoji');
    var wrapEl = document.querySelector('.wrap-breath');

    var t0 = performance.now(), raf = 0, stopTimer = 0;
    var stream=null, ctx=null, analyser=null, data=null;

    // הגדרות טבעת (רדיוס 54 → היקף ~339)
    var C = 339; // קבוע תואם ל-stroke-dasharray

    function fmt(ms){ var s=Math.max(0,Math.floor(ms/1000)); return '00:'+String(s%60).padStart(2,'0'); }

    function level(){
      if(analyser && data){
        analyser.getByteTimeDomainData(data);
        var sum=0; for(var i=0;i<data.length;i++){ var v=(data[i]-128)/128; sum+=v*v; }
        var rms=Math.sqrt(sum/data.length);
        return Math.min(100, Math.floor(rms*260));
      }
      return Math.min(100, (Math.random()*60+10)|0);
    }

    function loop(){
      var elapsed = performance.now() - t0;
      var rawLevel = level();
      var w;
      
      // NEW: הטרלה בניסיון 2 - הבר עולה לאט מאוד
      if(attempt === 2){
        // מחלקים את העוצמה ב-4 כדי שיעלה לאט
        w = Math.min(95, rawLevel / 4);
        
        // רק אחרי 2.5 שניות, נותנים לו לקפוץ ל-100%
        if(elapsed >= 2500){
          w = 100;
        }
      } else {
        // ניסיון 1: רגיל
        w = rawLevel;
      }
      
      bar.style.width = w + '%';
      timeEl.textContent = fmt(elapsed);

      // עדכוני ה-HERO (ויזואלי בלבד)
      try{
        // טבעת
        var off = C - (C*w/100);
        circ.style.strokeDashoffset = off;

        // NEW: "שבילי רוח" מתחילים בסף נמוך יותר + אפקט אדים
        if (w >= 45){ 
          gust.classList.add('on');
          wrapEl.classList.add('blowing');
        } else { 
          gust.classList.remove('on');
          wrapEl.classList.remove('blowing');
        }

        // אימוג'י נשיפה — scale עדין
        var s = 1 + (w*0.0035);
        emoji.style.transform = 'scale('+s+')';
      }catch(_){}

      raf = requestAnimationFrame(loop);
    }

    function cleanup(){
      try{ if(stream && stream.getTracks){ stream.getTracks().forEach(function(tr){tr.stop();}); } }catch(e){}
      try{ if(ctx && ctx.close){ ctx.close(); } }catch(e){}
      stream=null; ctx=null; analyser=null; data=null;
      try{ cancelAnimationFrame(raf); }catch(e){}
      try{ clearTimeout(stopTimer); }catch(e){}
      try{ wrapEl.classList.remove('blowing'); }catch(e){}
    }

    // נסיון הרשאת מיקרופון ל‑VU אמיתי (ללא הקלטה/שמירה)
    try{
      if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
        navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
          stream = s;
          ctx = new (window.AudioContext||window.webkitAudioContext)();
          var src = ctx.createMediaStreamSource(stream);
          analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
          data = new Uint8Array(analyser.frequencyBinCount);
          src.connect(analyser);
        }).catch(function(){ /* נשאר עם fallback */ });
      }
    }catch(_){}

    play('confirm');
    loop();

    // סיום לוגי: אין שינוי לפלואו (ניסיון 1 → שגיאה; ניסיון 2 → הצלחה)
    stopTimer = setTimeout(function(){
      cleanup();
      if(attempt===1){
        document.querySelector('.wrap-breath') && document.querySelector('.wrap-breath').classList.add('shake');
        setTimeout(function(){ try{ document.querySelector('.wrap-breath').classList.remove('shake'); }catch(_){ } }, 380);
        play('error');
        document.getElementById('bv-toast-err').classList.add('show');
        document.getElementById('bv-try').addEventListener('click', function(){
          document.getElementById('bv-toast-err').classList.remove('show');
          screenCount(2);
        }, { once:true });
      } else {
        play('tada');
        document.getElementById('bv-toast-ok').classList.add('show');
        document.getElementById('bv-go').addEventListener('click', function(){
          document.getElementById('bv-toast-ok').classList.remove('show');
          screenSuccess();
        }, { once:true });
      }
    }, attempt===1 ? 4000 : 3000);
  }

  function screenSuccess(){
    showKfBadge();
    app.innerHTML =
      '<div class="wrap wrap-breath' + (activeTheme !== 'dark' ? ' theme-' + activeTheme : '') + '">'+
        '<div class="bv-success-icon" aria-hidden="true">💝</div>'+
'<h1 class="bv-title">'+copy.okTitle+'</h1>'+
'<p class="bv-sub">'+copy.okSub+'</p>'+
'<button id="bv-open" class="btn bv green"'+(PREV?' disabled':'')+'>'+copy.okBtn+'</button>'+
        (PREV?'<div class="bv-sub">Preview only – button disabled</div>':'')+
        '<canvas id="bv-confetti" class="confetti-canvas"></canvas>'+
      '</div>';
    confettiBurst(document.getElementById('bv-confetti'));
    var b = document.getElementById('bv-open');
    b && b.addEventListener('click', function(){
      if(PREV) return;
      play('confirm');
      tryReactionFlow(GIFT);
    });
  }

  // GO
  screenIntro();
}
  
const map = {
'breath-verify': breathVerify,
'captcha': captcha,
'infinite': infinite,
'narcissist-q': narcissistQ,
'shake': shake
};

(map[F] || (()=>el('<h1 class="h1">Feature not found</h1><p class="p">Use ?f=captcha|infinite|narcissist-q|shake|breath-verify</p>')))();
})();
</script>
